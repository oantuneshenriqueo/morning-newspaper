name: Release

# Publishes a GitHub release with a freshly built morning-newspaper.zip.
# Two ways to trigger it:
#   1. Push a version tag:      git tag v1.1.0 && git push origin v1.1.0
#   2. Run it by hand:          Actions tab -> Release -> Run workflow -> type the version (e.g. v1.1.0)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Version must look like v1.2.3 (got '$TAG')"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the skill zip
        run: sh ./build-zip.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its zip."
            gh release upload "$TAG" dist/morning-newspaper.zip --clobber
          else
            gh release create "$TAG" dist/morning-newspaper.zip \
              --target "$GITHUB_SHA" \
              --title "Morning Newspaper $TAG" \
              --generate-notes
          fi
